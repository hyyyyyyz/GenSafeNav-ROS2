version: '3.8'

services:
  gensafenav:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gensafenav:humble
    container_name: gensafenav
    network_mode: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ── 环境变量 ──────────────────────────────────────────────────────────────
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=0

    # ── 挂载 ──────────────────────────────────────────────────────────────────
    volumes:
      - ..:/ros2_ws/src/GenSafeNav-ROS2
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /ros2_ws
    stdin_open: true
    tty: true
    command: /bin/bash
